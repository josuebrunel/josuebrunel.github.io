<style>
.toc {
  border: 1px solid var(--tb1-color);
  border-radius: 4px;
  padding: 0.5rem 1rem;
  margin: 1.5rem 0;
  background-color: var(--bg-color);
}
.toc > summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--ft-txt-color);
  font-size: 0.85em;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.toc #TableOfContents ul {
  margin: 0.75rem 0 0.25rem;
  padding-left: 1.2rem;
}
.toc #TableOfContents li {
  margin: 0.3rem 0;
  line-height: 1.4;
}
</style>
<details class="toc" open>
<summary>On this page</summary>
{{ .Page.TableOfContents }}
</details>
